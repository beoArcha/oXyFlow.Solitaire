name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install the ALSA development package for the audio feature
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Check the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask check --pr "origin/$BASE_REF"
      - name: Clippy without the audio feature, as the Linux release is built
        run: cargo clippy --no-default-features -p oxysol --all-targets -- -D warnings
      - name: Test without the audio feature
        run: cargo test --no-default-features -p oxysol
