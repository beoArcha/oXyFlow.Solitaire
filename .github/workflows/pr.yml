name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Install the ALSA development package for the audio feature
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Check the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask check --pr "origin/$BASE_REF"
      - name: Clippy without the audio feature, as the Linux release is built
        run: cargo clippy --no-default-features -p oxysol --all-targets -- -D warnings
      - name: Test without the audio feature
        run: cargo test --no-default-features -p oxysol

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.22.0
      - name: Check licenses, advisories, sources and bans
        run: cargo deny --locked check licenses advisories sources bans
