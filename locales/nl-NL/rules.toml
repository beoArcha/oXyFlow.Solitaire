# Strings of the "How to play" window. Placeholders such as {hint} are replaced with the key bound
# to that action in the key table, so the text never names a key that can change.

[game]
klondike = "Klondike"
spider = "Spider"
freecell = "FreeCell"
pyramid = "Piramide"
yukon = "Yukon"

[section]
goal = "Doel"
layout = "Opstelling"
moves = "Zetten"
controls = "Bediening"
tips = "Tips"

[control]
navigate = "Beweeg de cursor. Omhoog en Omlaag kiezen ook een kaart binnen een kolom."
select = "Pak de kaarten onder de cursor op en druk opnieuw op een doelstapel om ze neer te leggen."
select_pair = "Kies een vrije kaart en kies dan een tweede vrije kaart om het paar te verwijderen."
back = "Annuleer de opgepakte kaarten of verlaat het spel."
stock = "Trek een kaart van de stapel."
deal = "Deel een nieuwe rij vanaf de stapel."
run = "Pak meer of minder kaarten van een kolom op."
quick_move = "Stuur de kaarten onder de cursor naar het beste doel."
undo = "Maak de laatste zet ongedaan."
hint = "Licht een mogelijke zet op."
mouse = "Met de muis: klik op een kaart, klik dan op het doel; dubbelklik stuurt naar het beste doel; klik op de stapel om te trekken."

[klondike]
goal = "Verplaats alle 52 kaarten naar de vier fundamenten. Elk fundament wordt opgebouwd per kleur, van aas tot koning."
layout_1 = "Zeven kolommen bevatten 1 tot 7 kaarten. Alleen de bovenste kaart van elke kolom ligt open."
layout_2 = "De overige 24 kaarten vormen de stapel. Getrokken kaarten gaan naar de aflegstapel."
layout_3 = "1 kaart draait één kaart tegelijk om. 3 kaarten draait drie kaarten om, waarbij alleen de bovenste kaart van de aflegstapel gespeeld kan worden."
moves_1 = "Bouw kolommen afwisselend in kleur af, bijvoorbeeld een rode 6 op een zwarte 7."
moves_2 = "Een geordende reeks open kaarten beweegt samen. Alleen een koning of een reeks die met een koning begint kan naar een lege kolom."
moves_3 = "Een aas begint een fundament. Daarna volgt de volgende kaart van dezelfde kleur."
moves_4 = "Een dichte kaart wordt omgedraaid zodra deze vrijkomt."
moves_5 = "Wanneer de stapel leeg is, wordt de aflegstapel weer de stapel. Dit kan onbeperkt herhaald worden."
tips_1 = "Draai de dichte kaarten eerst om. Ze verbergen de kaarten die je nodig hebt."
tips_2 = "Verplaats azen en tweeën vroeg naar de fundamenten, maar bewaar kaarten die helpen kolommen te bouwen."
tips_3 = "Maak een kolom pas leeg wanneer je een koning klaar hebt liggen om erin te plaatsen."
tips_4 = "Zit je vast? Druk op {hint} voor een hint of op {undo} om een zet terug te nemen."

[spider]
goal = "Bouw acht complete reeksen van één kleur, van koning tot aas. Elke voltooide reeks verlaat de kolommen voor een fundament."
layout_1 = "Tien kolommen bevatten elk 5 of 6 kaarten. Alleen de bovenste kaart van elke kolom ligt open."
layout_2 = "De overige 50 kaarten vormen de stapel."
layout_3 = "Spider gebruikt 104 kaarten in 1, 2 of 4 kleuren. Minder kleuren maken het spel eenvoudiger."
moves_1 = "Bouw kolommen aflopend op rang in elke gewenste kleur, bijvoorbeeld een harten 6 op een schoppen 7."
moves_2 = "Alleen een aflopende reeks van dezelfde kleur kan als groep worden verplaatst."
moves_3 = "Een lege kolom accepteert elke kaart of reeks."
moves_4 = "Een complete reeks van koning tot aas wordt automatisch uit de kolom verwijderd."
moves_5 = "De stapel deelt één kaart uit op elke kolom. Dit kan niet zolang een kolom leeg is."
tips_1 = "Houd reeksen waar mogelijk in dezelfde kleur. Een gemengde reeks kan niet als groep bewegen."
tips_2 = "Maak vroeg een kolom leeg. Het is het nuttigste hulpmiddel in Spider."
tips_3 = "Vul elke lege kolom voordat je deelt vanaf de stapel met {stock}."
tips_4 = "Zoek naar andere zetten voordat je deelt. Een deelactie bedekt elke kolom."

[freecell]
goal = "Verplaats alle 52 kaarten naar de vier fundamenten. Elk fundament wordt opgebouwd per kleur, van aas tot koning."
layout_1 = "Alle 52 kaarten worden open gedeeld over acht kolommen, zodat je elke kaart kunt zien."
layout_2 = "Vier vrije cellen bevatten elk één kaart. Er is geen stapel."
moves_1 = "Bouw kolommen afwisselend in kleur af."
moves_2 = "Plaats een kaart in een vrije cel om ruimte te maken en neem hem weer terug wanneer het past."
moves_3 = "Fundamenten groeien per kleur vanaf de aas. Kaarten kunnen deze niet meer verlaten."
moves_4 = "Om meerdere kaarten tegelijk te verplaatsen heb je vrije cellen of lege kolommen nodig. Hoe meer je er hebt, hoe langer de reeks die je kunt verplaatsen."
moves_5 = "Een lege kolom accepteert elke kaart of reeks."
tips_1 = "Plan vooruit. Vrijwel elk spel kan gewonnen worden."
tips_2 = "Probeer niet alle vier de vrije cellen te vullen. Ze zijn je werkruimte."
tips_3 = "Een lege kolom is meer waard dan een vrije cel."
tips_4 = "Gebruik {undo} om een zet terug te nemen die niet goed uitpakte."

[pyramid]
goal = "Verwijder kaarten door twee kaarten te combineren waarvan de som 13 is. Een koning is op zichzelf 13 waard."
layout_1 = "28 kaarten vormen een piramide van zeven rijen. Een kaart is pas vrij als beide kaarten die hem bedekken weg zijn."
layout_2 = "De overige 24 kaarten vormen de stapel. Getrokken kaarten gaan naar de aflegstapel."
layout_3 = "Waarden: aas 1, boer 11, vrouw 12, koning 13, elke andere kaart zijn getal."
layout_4 = "Ontspannen staat 3 doorgangen door de stapel toe en is gewonnen als de piramide leeg is. Klassiek staat 1 doorgang toe en is gewonnen als alle 52 kaarten zijn weggespeeld."
moves_1 = "Vrije kaarten zijn de onbedekte piramidekaarten, de bovenste kaart van de stapel en de bovenste kaart van de aflegstapel."
moves_2 = "Kies een vrije kaart en vervolgens een tweede vrije kaart zodat de som 13 is. Beide kaarten worden verwijderd."
moves_3 = "Een vrije koning wordt alleen verwijderd: selecteer hem gewoon."
moves_4 = "Als er geen paren over zijn, trek dan van de stapel."
tips_1 = "Ruim de onderste rijen eerst op, zodat meer kaarten van de piramide vrijkomen."
tips_2 = "Controleer voordat je een kaart wegspeelt of zijn partner niet nodig is voor een ander paar."
tips_3 = "Druk op {hint} om een beschikbaar paar of trekzet te zien."

[yukon]
goal = "Verplaats alle 52 kaarten naar de vier fundamenten. Elk fundament wordt opgebouwd per kleur, van aas tot koning."
layout_1 = "Zeven kolommen. De eerste bevat één open kaart; de andere 1 tot 6 dichte kaarten onder vijf open kaarten."
layout_2 = "Alle 52 kaarten worden gedeeld. Er is geen stapel en er wordt niet opnieuw gedeeld."
moves_1 = "Bouw kolommen afwisselend in kleur af, bijvoorbeeld een rode 6 op een zwarte 7."
moves_2 = "Elke open kaart beweegt samen met alle kaarten die erop liggen, ook als die niet op volgorde liggen. Alleen de onderste kaart van de verplaatste groep moet passen."
moves_3 = "Alleen een koning, of een groep met een koning onderaan, kan naar een lege kolom."
moves_4 = "Een aas begint een fundament. Daarna volgt de volgende kaart van dezelfde kleur."
moves_5 = "Een dichte kaart wordt omgedraaid zodra deze vrijkomt."
tips_1 = "Draai eerst de dichte kaarten om, te beginnen bij de langste kolommen."
tips_2 = "Een groep hoeft niet op volgorde te liggen, dus je kunt diep in een kolom grijpen naar de kaart die je nodig hebt."
tips_3 = "Koningen zijn moeilijk te verplaatsen. Houd een lege kolom vrij voor een koning die dichte kaarten blokkeert."
tips_4 = "Zit je vast? Druk op {hint} voor een hint of op {undo} om een zet terug te nemen."
