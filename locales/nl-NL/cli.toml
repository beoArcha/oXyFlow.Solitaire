# Strings of the cli area.

version = "oXySol {version}"
version_legal = "Copyright (c) {year} {authors}. {license}-licentie."
help = """
oXySol: Ultiem kantoor-solitaire voor de terminal

Gebruik: oxysol [opties]

Opties:
  --version                    toon versie en licentie en sluit af
  -h, --help                   toon deze help en sluit af

Weergave:
  --ascii                      toon kaarten alleen met ASCII-tekens
  --colors <16|256|truecolor>  kleurdiepte van de terminal
  -fs, --fullscreen            start schermvullend, ongeacht instelling
  --no-fullscreen              start in venster, ongeacht instelling

Spel:
  --seed <u64>                 kies direct een spel voor deze seed

Prestaties:
  --priority <niveau>          procesprioriteit, wint van de instelling:
                               highest, high, normal, low, lowest

Venster:
  -n, --new-window             open het spel in een nieuw consolevenster en
                               keer direct terug naar de prompt

Dubbelklik of console:
  Een dubbelklik opent het spel in een eigen consolevenster dat sluit
  zodra het spel eindigt. Gestart vanuit een console draait het spel daarin,
  tenzij --new-window is opgegeven. Na een opstartfout wacht het venster
  op Enter.

Volledig scherm:
  De instelling Volledig scherm (Auto, Aan, Uit) staat in Instellingen.
  Auto gaat alleen schermvullend in vensters die het spel zelf heeft geopend.
  Een klassieke Windows-console schakelt het spel zelf; elders druk op
  Alt+Enter of F11 (Ctrl+Cmd+F op macOS). Het spel herstart zichzelf hier
  nooit voor.

Bestanden:
  OXYSOL_HOME      map voor database en logbestand (heeft altijd voorrang)
  oxysol.portable  markeringsbestand naast het programma: bestanden staan
                   dan daar in een data-map
  OXYSOL_LOG       logniveau: error, warn, info, debug of trace
"""
usage_error = "oxysol: {error}\nProbeer `oxysol --help` voor de lijst met opties."
paths_failed = "oXySol kan geen map vinden voor bestanden. Stel OXYSOL_HOME in op een beschrijfbare map."
storage_failed = "oXySol kan de database niet openen. Details staan in het logbestand."
terminal_failed = "oXySol is gestopt omdat de terminal faalde. Details staan in het logbestand."
output_failed = "oXySol kan niet schrijven naar de terminal."
new_window_failed = "oXySol kan geen nieuw consolevenster openen (geprobeerd: {tried}). Voer uit zonder --new-window."
log_unavailable = "oXySol kan logbestand {path} niet schrijven. Er wordt doorgegaan zonder logboek."
panic = "oXySol is onverwacht gestopt bij {location}. Details staan in {path}."
press_enter = "Druk op Enter om dit venster te sluiten."
