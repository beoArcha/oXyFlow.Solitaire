# Strings of the "How to play" window. Placeholders such as {hint} are replaced with the key bound
# to that action in the key table, so the text never names a key that can change.

[game]
klondike = "Klondike"
spider = "Spider"
freecell = "FreeCell"
pyramid = "Pirâmide"
yukon = "Yukon"

[section]
goal = "Objetivo"
layout = "Distribuição"
moves = "Movimentos"
controls = "Controles"
tips = "Dicas"

[control]
navigate = "Mova o cursor. Cima e Baixo também escolhem uma carta na coluna."
select = "Pegue as cartas sob o cursor e pressione novamente na pilha de destino para soltá-las."
select_pair = "Escolha uma carta livre e depois uma segunda carta livre para remover o par."
back = "Cancele as cartas que você pegou ou saia do jogo."
stock = "Compre uma carta do monte."
deal = "Distribua uma nova linha do monte."
run = "Pegue mais ou menos cartas de uma coluna."
quick_move = "Envie as cartas sob o cursor para o melhor destino."
undo = "Desfaça a última jogada."
hint = "Destaque uma jogada que você pode fazer."
mouse = "Com o mouse: clique na carta e depois no destino; clique duplo envia para o melhor destino; clique no monte para comprar."

[klondike]
goal = "Mova todas as 52 cartas para as quatro fundações. Cada fundação é construída por naipe, do ás ao rei."
layout_1 = "Sete colunas contêm de 1 a 7 cartas. Apenas a carta do topo de cada coluna fica aberta."
layout_2 = "As outras 24 cartas formam o monte. As cartas tiradas dele vão para o descarte."
layout_3 = "Comprar 1 vira uma carta por vez. Comprar 3 vira três cartas, e apenas a carta do topo do descarte pode ser jogada."
moves_1 = "Construa as colunas em ordem decrescente com cores alternadas, por exemplo um 6 vermelho sobre um 7 preto."
moves_2 = "Uma sequência de cartas abertas em ordem move-se junta. Apenas um rei, ou sequência iniciada por rei, pode ir para uma coluna vazia."
moves_3 = "Um ás inicia uma fundação. Depois dele vem a próxima carta do mesmo naipe."
moves_4 = "Uma carta oculta se vira assim que for descoberta."
moves_5 = "Quando o monte acabar, o descarte volta a ser o monte. Isso pode ser repetido sem limite."
tips_1 = "Revele as cartas ocultas primeiro. Elas escondem as cartas de que você precisa."
tips_2 = "Mova ases e dois para as fundações cedo, mas guarde cartas que ainda ajudem a montar colunas."
tips_3 = "Esvazie uma coluna apenas quando tiver um rei pronto para ocupar o espaço."
tips_4 = "Travou? Pressione {hint} para uma dica ou {undo} para desfazer uma jogada."

[spider]
goal = "Monte oito sequências completas de um mesmo naipe, do rei ao ás. Cada sequência concluída sai das colunas para uma fundação."
layout_1 = "Dez colunas contêm 5 ou 6 cartas cada. Apenas a carta do topo de cada coluna fica aberta."
layout_2 = "As outras 50 cartas formam o monte."
layout_3 = "Spider usa 104 cartas em 1, 2 ou 4 naipes. Menos naipes tornam o jogo mais fácil."
moves_1 = "Construa as colunas em ordem decrescente em qualquer naipe, por exemplo um 6 de copas sobre um 7 de espadas."
moves_2 = "Apenas uma sequência do mesmo naipe em ordem decrescente pode ser movida em grupo."
moves_3 = "Uma coluna vazia pode receber qualquer carta ou sequência."
moves_4 = "Uma sequência completa do rei ao ás é removida da coluna automaticamente."
moves_5 = "O monte distribui uma carta em cada coluna. Ele não pode ser usado enquanto houver colunas vazias."
tips_1 = "Mantenha sequências no mesmo naipe quando possível. Uma sequência mista não se move em grupo."
tips_2 = "Esvazie uma coluna cedo. É a ferramenta mais útil no Spider."
tips_3 = "Preencha todas as colunas vazias antes de distribuir do monte com {stock}."
tips_4 = "Procure outras jogadas antes de distribuir. A distribuição cobre todas as colunas."

[freecell]
goal = "Mova todas as 52 cartas para as quatro fundações. Cada fundação é construída por naipe, do ás ao rei."
layout_1 = "Todas as 52 cartas são distribuídas abertas em oito colunas, para que você veja cada carta."
layout_2 = "Quatro células livres guardam uma carta cada. Não há monte."
moves_1 = "Construa colunas em ordem decrescente com cores alternadas."
moves_2 = "Coloque uma carta em uma célula livre para desimpedir o jogo e retire-a quando ela couber."
moves_3 = "As fundações crescem por naipe a partir do ás. As cartas não podem sair delas."
moves_4 = "Para mover várias cartas de uma vez, você precisa de células livres ou colunas vazias. Quanto mais tiver, maior a sequência que pode mover."
moves_5 = "Uma coluna vazia aceita qualquer carta ou sequência."
tips_1 = "Planeje com antecedência. Quase todas as partidas têm solução."
tips_2 = "Tente não ocupar todas as quatro células livres. Elas são o seu espaço de manobra."
tips_3 = "Uma coluna vazia vale mais do que uma célula livre."
tips_4 = "Use {undo} para desfazer uma jogada que não deu certo."

[pyramid]
goal = "Remova cartas combinando duas cujo valor totalize 13. O rei vale 13 sozinho."
layout_1 = "28 cartas formam uma pirâmide de sete linhas. Uma carta só fica livre quando ambas as cartas sobre ela tiverem saído."
layout_2 = "As outras 24 cartas formam o monte. As cartas tiradas dele vão para o descarte."
layout_3 = "Valores: ás 1, valete 11, dama 12, rei 13, qualquer outra carta pelo seu número."
layout_4 = "Relaxada permite 3 giros pelo monte e é vencida quando a pirâmide fica vazia. Clássica permite 1 giro e é vencida quando todas as 52 cartas são removidas."
moves_1 = "Cartas livres são as cartas descobertas da pirâmide, a carta do topo do monte e a do topo do descarte."
moves_2 = "Pegue uma carta livre e depois uma segunda carta livre cuja soma seja 13. Ambas as cartas são removidas."
moves_3 = "Um rei livre é removido sozinho: basta selecioná-lo."
moves_4 = "Quando não houver pares disponíveis, compre do monte."
tips_1 = "Limpe as linhas inferiores primeiro, para que mais cartas da pirâmide fiquem livres."
tips_2 = "Antes de remover uma carta, veja se o par dela não é necessário para outra carta."
tips_3 = "Pressione {hint} para ver um par ou uma compra disponível."

[yukon]
goal = "Mova todas as 52 cartas para as quatro fundações. Cada fundação é construída por naipe, do ás ao rei."
layout_1 = "Sete colunas. A primeira tem uma carta aberta; as outras têm de 1 a 6 cartas ocultas sob cinco cartas abertas."
layout_2 = "Todas as 52 cartas são distribuídas. Não há monte nem nova distribuição."
layout_3 = "A paciência russa distribui da mesma forma, mas monta as colunas em ordem decrescente no mesmo naipe, em vez de cores alternadas: um 6 de copas só vai sobre um 7 de copas."
layout_4 = "A paciência Alasca distribui da mesma forma, mas monta as colunas em ordem crescente ou decrescente de uma carta no mesmo naipe: um 6 de copas só vai sobre um 5 ou um 7 de copas."
layout_5 = "Moosehide distribui do mesmo jeito, mas monta as colunas descendo uma carta em qualquer naipe, exceto o mesmo: um 6 de paus vai sobre um 7 de espadas, um 6 de espadas não."
moves_1 = "Construa as colunas em ordem decrescente com cores alternadas, por exemplo um 6 vermelho sobre um 7 preto."
moves_2 = "Qualquer carta aberta se move junto com todas as cartas sobre ela, mesmo fora de ordem. Só a carta de baixo do grupo movido precisa encaixar."
moves_3 = "Apenas um rei, ou um grupo com um rei embaixo, pode ir para uma coluna vazia."
moves_4 = "Um ás inicia uma fundação. Depois dele vem a próxima carta do mesmo naipe."
moves_5 = "Uma carta oculta se vira assim que for descoberta."
tips_1 = "Revele as cartas ocultas primeiro, começando pelas colunas mais longas."
tips_2 = "Um grupo não precisa estar em ordem, então você pode buscar no fundo de uma coluna a carta de que precisa."
tips_3 = "Reis são difíceis de mover. Guarde uma coluna vazia para um rei que bloqueia cartas ocultas."
tips_4 = "Travou? Pressione {hint} para uma dica ou {undo} para desfazer uma jogada."
