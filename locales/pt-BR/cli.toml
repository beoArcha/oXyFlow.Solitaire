# Strings of the cli area.

version = "oXySol {version}"
version_legal = "Copyright (c) {year} {authors}. Licença {license}."
help = """
oXySol: O melhor Paciência de escritório para o terminal

Uso: oxysol [opções]

Opções:
  --version                    exibe a versão e licença, e sai
  --help                       exibe esta ajuda e sai

Vídeo:
  --ascii                      desenha cartas apenas com caracteres ASCII
  --colors <16|256|truecolor>  profundidade de cores do terminal
  --fullscreen                 inicia em tela cheia, independente da configuração
  --no-fullscreen              inicia em janela, independente da configuração

Jogo:
  --seed <u64>                 inicia um jogo com esta semente diretamente

Desempenho:
  --priority <nível>           prioridade do processo, vale mais que o ajuste:
                               highest, high, normal, low, lowest

Janela:
  -n, --new-window             abre o jogo em uma nova janela de console e
                               retorna ao prompt imediatamente

Clique duplo ou console:
  O clique duplo abre o jogo em sua própria janela de console, que fecha
  quando o jogo termina. Iniciado pelo console, o jogo roda nele,
  a menos que --new-window seja usado. Após um erro na inicialização,
  a janela aguarda Enter.

Tela cheia:
  A opção Tela cheia (Auto, Ligado, Desligado) fica em Configurações. Auto
  só ativa tela cheia em janela aberta pelo próprio jogo. No console clássico
  do Windows, o jogo alterna sozinho; em outros lugares use Alt+Enter ou F11
  (Ctrl+Cmd+F no macOS). O jogo nunca se reinicia para isso.

Arquivos:
  OXYSOL_HOME      pasta do banco de dados e do log (sempre prevalece)
  oxysol.portable  arquivo indicador junto ao executável: os arquivos
                   ficam em uma pasta de dados no mesmo local
  OXYSOL_LOG       nível de log: error, warn, info, debug ou trace
"""
usage_error = "oxysol: {error}\nTente `oxysol --help` para ver a lista de opções."
paths_failed = "oXySol não consegue encontrar uma pasta para seus arquivos. Defina OXYSOL_HOME para uma pasta com permissão de escrita."
storage_failed = "oXySol não consegue abrir seu banco de dados. Os detalhes estão no arquivo de log."
terminal_failed = "oXySol parou porque o terminal falhou. Os detalhes estão no arquivo de log."
output_failed = "oXySol não consegue escrever no terminal."
new_window_failed = "oXySol não consegue abrir uma nova janela de console (tentativas: {tried}). Execute-o sem --new-window."
log_unavailable = "oXySol não consegue escrever em seu arquivo de log {path}. O jogo continua sem log."
panic = "oXySol parou inesperadamente em {location}. Os detalhes estão em {path}."
press_enter = "Pressione Enter para fechar esta janela."
