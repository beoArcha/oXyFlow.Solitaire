# Strings of the cli area.

version = "oXySol {version}"
version_legal = "Copyright (c) {year} {authors}. Ліцензія {license}."
help = """
oXySol: найкращий офісний пасьянс для термінала

Використання: oxysol [параметри]

Параметри:
  --version                    вивести версію та ліцензію й вийти
  -h, --help                   вивести цю довідку й вийти

Вигляд:
  --ascii                      малювати карти лише знаками ASCII
  --colors <16|256|truecolor>  глибина кольору термінала
  -fs, --fullscreen            старт на повний екран, попри налаштування
  --no-fullscreen              старт у вікні, попри налаштування

Гра:
  --seed <u64>                 одразу вибрати гру для цього зерна

Продуктивність:
  --priority <рівень>          пріоритет процесу, має перевагу над налаштуванням:
                               highest, high, normal, low, lowest

Вікно:
  -n, --new-window             відкрити гру в новому вікні консолі й
                               одразу повернутися до командного рядка

Подвійний клік або консоль:
  Подвійний клік відкриває гру у власному вікні консолі, яке
  закривається після виходу з гри. Під час запуску з консолі гра
  працює всередині неї, якщо не вказано --new-window. У разі помилки
  запуску вікно чекає на Enter.

Повний екран:
  Налаштування «Повний екран» (Авто, Увімк., Вимк.) є в «Налаштуваннях».
  Авто вмикає повний екран лише у вікні, відкритому самою грою.
  Класичну консоль Windows перемикає гра; в інших місцях натисни
  Alt+Enter або F11 (Ctrl+Cmd+F на macOS). Гра не перезапускається.

Файли:
  OXYSOL_HOME      папка для бази даних і журналу (має перевагу)
  oxysol.portable  файл-маркер поруч із програмою: тоді файли
                   зберігаються в папці data поруч
  OXYSOL_LOG       рівень журналу: error, warn, info, debug або trace
"""
