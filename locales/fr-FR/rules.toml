# Strings of the "How to play" window. Placeholders such as {hint} are replaced with the key bound
# to that action in the key table, so the text never names a key that can change.

[game]
klondike = "Klondike"
spider = "Spider"
freecell = "FreeCell"
pyramid = "Pyramide"
yukon = "Yukon"
golf = "Golf"
tripeaks = "TriPeaks"

[section]
goal = "Objectif"
layout = "Disposition"
moves = "Coups"
controls = "Commandes"
tips = "Conseils"

[control]
navigate = "Déplace le curseur. Haut et Bas choisissent aussi une carte dans une colonne."
select = "Prends les cartes sous le curseur, puis appuie à nouveau sur une pile cible pour les poser."
select_pair = "Choisis une carte libre, puis une deuxième carte libre pour retirer la paire."
back = "Repose les cartes prises, ou quitte la partie."
stock = "Tire une carte de la pioche."
deal = "Distribue une nouvelle rangée depuis la pioche."
run = "Prends plus ou moins de cartes d'une colonne."
quick_move = "Envoie les cartes sous le curseur vers la meilleure cible."
waste_quick_move = "Envoie la carte du dessus de la défausse vers sa meilleure cible, de n'importe où, sans déplacer le curseur."
undo = "Annule le dernier coup."
hint = "Met en surbrillance un coup possible."
mouse = "À la souris : clique sur une carte, puis sur sa cible ; un double-clic envoie une carte sur sa meilleure cible ; clique sur la pioche pour tirer."

[klondike]
goal = "Déplace les 52 cartes sur les quatre fondations. Chaque fondation est construite par couleur, de l'as au roi."
layout_1 = "Sept colonnes contiennent de 1 à 7 cartes. Seule la carte du dessus de chaque colonne est face visible."
layout_2 = "Les 24 autres cartes forment la pioche. Les cartes tirées vont dans la défausse."
layout_3 = "Tirage 1 carte retourne une carte à la fois. Tirage 3 cartes en retourne trois, et seule la carte du dessus de la défausse est jouable."
moves_1 = "Construis les colonnes en descendant et en alternant les couleurs, par exemple un 6 rouge sur un 7 noir."
moves_2 = "Une suite ordonnée de cartes visibles se déplace ensemble. Seul un roi, ou une suite commençant par un roi, peut aller sur une colonne vide."
moves_3 = "Un as commence une fondation. Vient ensuite la carte suivante de la même couleur."
moves_4 = "Une carte face cachée est retournée dès qu'elle est découverte."
moves_5 = "Quand la pioche est vide, la défausse est retournée pour reformer la pioche. Cela peut être répété sans limite."
tips_1 = "Découvre les cartes face cachée en priorité. Elles dissimulent les cartes dont tu as besoin."
tips_2 = "Place vite les as et les deux sur les fondations, mais garde les cartes qui aident à construire les colonnes."
tips_3 = "Ne vide une colonne que si tu as un roi prêt à y être déplacé."
tips_4 = "Bloqué ? Appuie sur {hint} pour un indice, ou sur {undo} pour annuler un coup."

[spider]
goal = "Forme huit suites complètes d'une même couleur, du roi à l'as. Chaque suite terminée quitte les colonnes vers une fondation."
layout_1 = "Dix colonnes contiennent 5 ou 6 cartes chacune. Seule la carte du dessus de chaque colonne est face visible."
layout_2 = "Les 50 autres cartes forment la pioche."
layout_3 = "Spider utilise 104 cartes avec 1, 2 ou 4 couleurs. Moins de couleurs rend le jeu plus facile."
moves_1 = "Construis les colonnes en descendant par valeur quelle que soit la couleur, par exemple un 6 de cœur sur un 7 de pique."
moves_2 = "Seule une suite d'une même couleur en ordre décroissant peut être déplacée en groupe."
moves_3 = "Une colonne vide accepte n'importe quelle carte ou suite."
moves_4 = "Une suite complète du roi à l'as est automatiquement retirée de la colonne."
moves_5 = "La pioche distribue une carte sur chaque colonne. Elle ne peut pas être utilisée si une colonne est vide."
tips_1 = "Garde les suites dans une seule couleur quand tu peux. Une suite mixte ne peut pas bouger en groupe."
tips_2 = "Vide une colonne rapidement. C'est l'outil le plus utile dans Spider."
tips_3 = "Remplis chaque colonne vide avant de distribuer depuis la pioche avec {stock}."
tips_4 = "Cherche d'autres coups avant de distribuer. Une distribution recouvre chaque colonne."

[freecell]
goal = "Déplace les 52 cartes sur les quatre fondations. Chaque fondation est construite par couleur, de l'as au roi."
layout_1 = "Les 52 cartes sont distribuées face visible sur huit colonnes, pour que chaque carte soit visible."
layout_2 = "Quatre cellules libres accueillent une carte chacune. Il n'y a pas de pioche."
moves_1 = "Construis les colonnes en descendant et en alternant les couleurs."
moves_2 = "Place une carte dans une cellule libre pour libérer le passage, et reprends-la dès qu'elle convient."
moves_3 = "Les fondations montent par couleur à partir de l'as. Les cartes ne peuvent plus en sortir."
moves_4 = "Pour déplacer plusieurs cartes à la fois, il faut des cellules libres ou des colonnes vides. Plus il y en a, plus la suite déplaçable est longue."
moves_5 = "Une colonne vide accepte n'importe quelle carte ou suite."
tips_1 = "Anticipe tes coups. Presque toutes les donnes peuvent être gagnées."
tips_2 = "Évite de remplir les quatre cellules libres. Elles constituent ton espace de manœuvre."
tips_3 = "Une colonne vide a plus de valeur qu'une cellule libre."
tips_4 = "Utilise {undo} pour annuler un coup qui ne fonctionne pas."

[pyramid]
goal = "Retire les cartes en formant des paires dont la somme vaut 13. Le roi vaut 13 à lui seul."
layout_1 = "28 cartes forment une pyramide de sept rangées. Une carte est libre seulement si les deux cartes qui la recouvrent ont disparu."
layout_2 = "Les 24 autres cartes forment la pioche. Les cartes tirées vont dans la défausse."
layout_3 = "Valeurs : as 1, valet 11, dame 12, roi 13, toute autre carte sa valeur nominale."
layout_4 = "Détente autorise 3 passages de la pioche et est gagné quand la pyramide est vide. Classique autorise 1 passage et est gagné quand les 52 cartes sont retirées."
moves_1 = "Les cartes libres sont les cartes découvertes de la pyramide, la carte du dessus de la pioche et celle de la défausse."
moves_2 = "Choisis une carte libre, puis une seconde carte libre dont la somme vaut 13. Les deux cartes sont retirées."
moves_3 = "Un roi libre est retiré seul : il suffit de le choisir."
moves_4 = "Quand aucune paire n'est possible, tire une carte de la pioche."
tips_1 = "Dégage d'abord les rangées du bas pour libérer plus de cartes de la pyramide."
tips_2 = "Avant de retirer une carte, vérifie que son partenaire n'est pas nécessaire pour une autre paire."
tips_3 = "Appuie sur {hint} pour afficher une paire ou un tirage disponible."

[yukon]
goal = "Déplace les 52 cartes sur les quatre fondations. Chaque fondation est construite par couleur, de l'as au roi."
layout_1 = "Sept colonnes. La première contient une carte visible ; les autres, de 1 à 6 cartes face cachée sous cinq cartes visibles."
layout_2 = "Les 52 cartes sont distribuées. Il n'y a ni pioche ni nouvelle donne."
layout_3 = "Le solitaire russe distribue de la même façon, mais construit les colonnes en descendant dans une même enseigne au lieu d'alterner les couleurs : un 6 de cœur ne va que sur un 7 de cœur."
layout_4 = "Alaska distribue de la même façon, mais construit les colonnes en montant ou en descendant d'un rang dans une même enseigne : un 6 de cœur ne va que sur un 5 ou un 7 de cœur."
layout_5 = "Moosehide distribue de la même façon, mais construit les colonnes en descendant d'un rang dans n'importe quelle enseigne sauf la même : un 6 de trèfle va sur un 7 de pique, un 6 de pique non."
layout_6 = "La patience australienne distribue sept colonnes de quatre cartes visibles ; les 24 autres cartes forment la pioche. On retourne la pioche carte par carte sur la défausse : un seul passage, sans nouvelle donne. La carte du dessus de la défausse peut aller sur une colonne ou une fondation. Les colonnes se construisent en descendant dans une seule enseigne, comme au solitaire russe."
moves_1 = "Construis les colonnes en descendant et en alternant les couleurs, par exemple un 6 rouge sur un 7 noir."
moves_2 = "Toute carte visible se déplace avec toutes les cartes posées dessus, même si elles ne sont pas en ordre. Seule la carte du bas du groupe déplacé doit convenir."
moves_3 = "Seul un roi, ou un groupe avec un roi en bas, peut aller sur une colonne vide."
moves_4 = "Un as commence une fondation. Vient ensuite la carte suivante de la même couleur."
moves_5 = "Une carte face cachée est retournée dès qu'elle est découverte."
tips_1 = "Découvre les cartes face cachée en priorité, en commençant par les colonnes les plus longues."
tips_2 = "Un groupe n'a pas besoin d'être en ordre : tu peux aller chercher loin dans une colonne la carte dont tu as besoin."
tips_3 = "Les rois sont difficiles à déplacer. Garde une colonne vide pour un roi qui bloque des cartes face cachée."
tips_4 = "Bloqué ? Appuie sur {hint} pour un indice, ou sur {undo} pour annuler un coup."

[golf]
goal = "Retire les 35 cartes des sept colonnes en les jouant sur la défausse."
layout_1 = "Sept colonnes de cinq cartes visibles. La première carte de la pioche est posée sur la défausse pour la commencer ; les 16 autres restent dans la pioche."
layout_2 = "Il n'y a ni fondation ni nouvelle donne : la pioche se retourne carte par carte, une seule fois."
moves_1 = "Joue la carte du dessus d'une colonne sur la défausse quand son rang est d'un cran plus haut ou plus bas que la carte du dessus de la défausse, dans n'importe quelle couleur : un 7 va sur un 6 ou un 8."
moves_2 = "Le roi et l'as ne sont pas voisins, donc pas de bouclage : seule une dame va sur un roi, et seul un 2 sur un as."
moves_3 = "Chaque carte jouée devient la nouvelle carte du dessus de la défausse : une suite peut monter, descendre ou changer de sens."
moves_4 = "Quand aucune carte de colonne ne convient, retourne la carte suivante de la pioche sur la défausse. Pioche vide et aucune carte jouable : tu es bloqué."
tips_1 = "Cherche la plus longue suite que tu peux jouer avant de retourner une carte de la pioche."
tips_2 = "Une suite qui passe d'une colonne à l'autre prolonge la chaîne ; prévois donc quelle colonne vider en premier."
tips_3 = "Bloqué ? Appuie sur {hint} pour un conseil, ou sur {undo} pour annuler un coup."

[tripeaks]
goal = "Retire les 28 cartes des trois pics en les jouant sur la défausse."
layout_1 = "28 cartes forment trois pics qui se chevauchent en rangées de 3, 6, 9 et 10. Seule la rangée du bas commence face visible ; une carte cachée est retournée dès que les deux cartes qui la recouvrent sont retirées."
layout_2 = "Une carte commence la défausse ; les 23 autres forment la pioche. Il n'y a ni fondation ni nouvelle donne."
moves_1 = "Joue une carte visible et dégagée d'un pic sur la défausse quand son rang est d'un cran plus haut ou plus bas que la carte du dessus de la défausse, dans n'importe quelle couleur : un 7 va sur un 6 ou un 8."
moves_2 = "Le roi et l'as bouclent entre eux : un roi va sur un as et un as va sur un roi."
moves_3 = "Chaque carte jouée devient la nouvelle carte du dessus de la défausse : une suite peut monter, descendre ou changer de sens."
moves_4 = "Quand aucune carte des pics ne convient, retourne la carte suivante de la pioche sur la défausse. Pioche vide et aucune carte jouable : tu es bloqué."
tips_1 = "Cherche de longues suites qui découvrent des cartes face cachée dans les pics."
tips_2 = "Utilise les boucles entre roi et as pour relier les séries hautes et basses avant de piocher."
tips_3 = "Bloqué ? Appuie sur {hint} pour un conseil, ou sur {undo} pour annuler un coup."
