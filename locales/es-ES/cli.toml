# Strings of the cli area.

version = "oXySol {version}"
version_legal = "Copyright (c) {year} {authors}. Licencia {license}."
help = """
oXySol: El solitario de oficina definitivo para el terminal

Uso: oxysol [opciones]

Opciones:
  --version                    muestra la versión y licencia, y sale
  --help                       muestra esta ayuda y sale

Pantalla:
  --ascii                      dibuja cartas solo con caracteres ASCII
  --colors <16|256|truecolor>  profundidad de color del terminal
  --fullscreen                 inicia en pantalla completa, según o no los ajustes
  --no-fullscreen              inicia en ventana, según o no los ajustes

Juego:
  --seed <u64>                 elige una partida con esta semilla al instante

Ventana:
  -n, --new-window             abre el juego en una nueva ventana de consola
                               y regresa al intérprete de inmediato

Doble clic o consola:
  Un doble clic abre el juego en su propia ventana de consola, que se cierra
  al salir del juego. Si se inicia desde consola, el juego corre en ella,
  a menos que se use --new-window. Tras un error de inicio, la ventana
  espera a que se pulse Enter.

Pantalla completa:
  El ajuste Pantalla completa (Auto, Sí, No) está en Ajustes. Auto solo activa
  pantalla completa en una ventana que haya abierto el propio juego. En una
  consola clásica de Windows, el juego cambia solo; en otros casos, pulsa
  Alt+Enter o F11 (Ctrl+Cmd+F en macOS). El juego nunca se reinicia para esto.

Archivos:
  OXYSOL_HOME      carpeta para la base de datos y el registro (prioritaria)
  oxysol.portable  archivo marcador junto al programa: los archivos quedan
                   en una subcarpeta data en esa misma ruta
  OXYSOL_LOG       nivel de registro: error, warn, info, debug o trace
"""
usage_error = "oxysol: {error}\nPrueba `oxysol --help` para ver la lista de opciones."
paths_failed = "oXySol no encuentra una carpeta para sus archivos. Define OXYSOL_HOME con una carpeta con permisos de escritura."
storage_failed = "oXySol no puede abrir su base de datos. Los detalles están en el archivo de registro."
terminal_failed = "oXySol se detuvo por un fallo en el terminal. Los detalles están en el archivo de registro."
output_failed = "oXySol no puede escribir en el terminal."
new_window_failed = "oXySol no puede abrir una nueva ventana de consola (intentos: {tried}). Ejecútalo sin --new-window."
log_unavailable = "oXySol no puede escribir en su archivo de registro {path}. Continúa sin registro."
panic = "oXySol se detuvo inesperadamente en {location}. Los detalles están en {path}."
press_enter = "Pulsa Enter para cerrar esta ventana."
