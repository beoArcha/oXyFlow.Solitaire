# Strings of the "How to play" window. Placeholders such as {hint} are replaced with the key bound
# to that action in the key table, so the text never names a key that can change.

[game]
klondike = "Klondike"
spider = "Spider"
freecell = "FreeCell"
pyramid = "Pirámide"
yukon = "Yukon"

[section]
goal = "Objetivo"
layout = "Distribución"
moves = "Movimientos"
controls = "Controles"
tips = "Consejos"

[control]
navigate = "Mueve el cursor. Arriba y Abajo también eligen una carta dentro de una columna."
select = "Coge las cartas bajo el cursor y vuelve a pulsar en una pila de destino para soltarlas."
select_pair = "Elige una carta libre y luego otra libre para eliminar la pareja."
back = "Cancela las cartas cogidas o sal de la partida."
stock = "Roba una carta del mazo."
deal = "Reparte una fila nueva desde el mazo."
run = "Coge más o menos cartas de una columna."
quick_move = "Envía las cartas bajo el cursor a su mejor destino."
undo = "Deshaz el último movimiento."
hint = "Resalta un movimiento que puedes hacer."
mouse = "Con el ratón: clic en una carta y luego en su destino; doble clic envía la carta a su mejor destino; clic en el mazo para robar."

[klondike]
goal = "Lleva las 52 cartas a las cuatro bases. Cada base se construye por palo, del as al rey."
layout_1 = "Siete columnas tienen de 1 a 7 cartas. Solo la carta superior de cada columna está boca arriba."
layout_2 = "Las otras 24 cartas forman el mazo. Las cartas robadas van al descarte."
layout_3 = "1 carta voltea una carta cada vez. 3 cartas voltea tres cartas, y solo se puede jugar la superior del descarte."
moves_1 = "Construye columnas hacia abajo alternando colores, por ejemplo un 6 rojo sobre un 7 negro."
moves_2 = "Una secuencia ordenada de cartas boca arriba se mueve junta. Solo un rey, o una secuencia que empiece por rey, puede ir a una columna vacía."
moves_3 = "El as inicia una base. Después va la siguiente carta del mismo palo."
moves_4 = "Una carta boca abajo se voltea en cuanto queda al descubierto."
moves_5 = "Cuando el mazo se agota, el descarte vuelve a ser el mazo. Esto se puede repetir sin límite."
tips_1 = "Descubre primero las cartas boca abajo. Ocultan las cartas que necesitas."
tips_2 = "Lleva pronto los ases y doses a las bases, pero guarda cartas que aún ayuden a construir columnas."
tips_3 = "Vacía una columna solo cuando tengas un rey listo para mover a ella."
tips_4 = "¿Atascado? Pulsa {hint} para una pista o {undo} para deshacer un movimiento."

[spider]
goal = "Forma ocho secuencias completas de un mismo palo, del rey al as. Cada secuencia completa sale de las columnas a una base."
layout_1 = "Diez columnas tienen 5 o 6 cartas cada una. Solo la carta superior de cada columna está boca arriba."
layout_2 = "Las otras 50 cartas forman el mazo."
layout_3 = "Spider usa 104 cartas en 1, 2 o 4 palos. Menos palos hacen el juego más fácil."
moves_1 = "Construye columnas hacia abajo por valor en cualquier palo, por ejemplo un 6 de corazones sobre un 7 de picas."
moves_2 = "Solo una secuencia del mismo palo en orden descendente se puede mover como grupo."
moves_3 = "Una columna vacía acepta cualquier carta o secuencia."
moves_4 = "Una secuencia completa del rey al as se retira de la columna automáticamente."
moves_5 = "El mazo reparte una carta en cada columna. No se puede usar mientras haya alguna columna vacía."
tips_1 = "Mantén secuencias del mismo palo cuando puedas. Una secuencia mixta no puede moverse en grupo."
tips_2 = "Vacía una columna pronto. Es la herramienta más útil en Spider."
tips_3 = "Llena todas las columnas vacías antes de repartir del mazo con {stock}."
tips_4 = "Busca otros movimientos antes de repartir. El reparto cubre todas las columnas."

[freecell]
goal = "Lleva las 52 cartas a las cuatro bases. Cada base se construye por palo, del as al rey."
layout_1 = "Las 52 cartas se reparten boca arriba en ocho columnas, de modo que puedes ver todas las cartas."
layout_2 = "Cuatro celdas libres guardan una carta cada una. No hay mazo."
moves_1 = "Construye columnas hacia abajo alternando colores."
moves_2 = "Pon una carta en una celda libre para apartarla del camino y vuelve a sacarla cuando encaje."
moves_3 = "Las bases crecen por palo a partir del as. Las cartas no pueden salir de ellas."
moves_4 = "Para mover varias cartas a la vez necesitas celdas libres o columnas vacías. Cuantas más tengas, más larga será la secuencia que puedes mover."
moves_5 = "Una columna vacía acepta cualquier carta o secuencia."
tips_1 = "Planifica con antelación. Casi todas las partidas se pueden ganar."
tips_2 = "Intenta no llenar las cuatro celdas libres. Son tu espacio de maniobra."
tips_3 = "Una columna vacía vale más que una celda libre."
tips_4 = "Usa {undo} para deshacer un movimiento que no haya funcionado."

[pyramid]
goal = "Elimina cartas emparejando dos cuyos valores sumen 13. El rey vale 13 por sí solo."
layout_1 = "28 cartas forman una pirámide de siete filas. Una carta queda libre solo cuando no la cubre ninguna otra."
layout_2 = "Las otras 24 cartas forman el mazo. Las cartas robadas van al descarte."
layout_3 = "Valores: as 1, jota 11, reina 12, rey 13, y las demás cartas según su número."
layout_4 = "Relajada permite 3 vueltas al mazo y se gana vaciando la pirámide. Clásica permite 1 vuelta y se gana eliminando las 52 cartas."
moves_1 = "Son cartas libres las destapadas de la pirámide, la superior del mazo y la superior del descarte."
moves_2 = "Elige una carta libre y luego otra cuya suma sea 13. Ambas cartas se eliminan."
moves_3 = "Un rey libre se elimina solo: basta con seleccionarlo."
moves_4 = "Cuando no haya parejas posibles, roba del mazo."
tips_1 = "Despeja las filas inferiores primero para liberar más cartas de la pirámide."
tips_2 = "Antes de quitar una carta, mira si su pareja hace falta para otra carta."
tips_3 = "Pulsa {hint} para ver una pareja o robo disponible."

[yukon]
goal = "Lleva las 52 cartas a las cuatro bases. Cada base se construye por palo, del as al rey."
layout_1 = "Siete columnas. La primera tiene una carta boca arriba; las demás, de 1 a 6 cartas boca abajo bajo cinco cartas boca arriba."
layout_2 = "Se reparten las 52 cartas. No hay mazo ni nuevo reparto."
layout_3 = "El solitario ruso reparte igual, pero construye las columnas hacia abajo en un solo palo en lugar de alternar colores: un 6 de corazones solo va sobre un 7 de corazones."
moves_1 = "Construye columnas hacia abajo alternando colores, por ejemplo un 6 rojo sobre un 7 negro."
moves_2 = "Cualquier carta boca arriba se mueve junto con todas las cartas que tiene encima, aunque no estén en orden. Solo la carta de abajo del grupo movido debe encajar."
moves_3 = "Solo un rey, o un grupo con un rey abajo, puede ir a una columna vacía."
moves_4 = "El as inicia una base. Después va la siguiente carta del mismo palo."
moves_5 = "Una carta boca abajo se voltea en cuanto queda al descubierto."
tips_1 = "Descubre primero las cartas boca abajo, empezando por las columnas más largas."
tips_2 = "Un grupo no tiene que estar en orden, así que puedes buscar a fondo en una columna la carta que necesitas."
tips_3 = "A los reyes cuesta moverlos. Guarda una columna vacía para un rey que bloquee cartas boca abajo."
tips_4 = "¿Atascado? Pulsa {hint} para una pista o {undo} para deshacer un movimiento."
