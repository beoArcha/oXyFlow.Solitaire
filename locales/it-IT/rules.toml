# Strings of the "How to play" window. Placeholders such as {hint} are replaced with the key bound
# to that action in the key table, so the text never names a key that can change.

[game]
klondike = "Klondike"
spider = "Spider"
freecell = "FreeCell"
pyramid = "Piramide"
yukon = "Yukon"
golf = "Golf"
tripeaks = "TriPeaks"

[section]
goal = "Scopo"
layout = "Disposizione"
moves = "Mosse"
controls = "Comandi"
tips = "Consigli"

[control]
navigate = "Muovi il cursore. Su e Giù scelgono anche una carta all'interno della colonna."
select = "Prendi le carte sotto il cursore, poi premi su una pila di destinazione per posarle."
select_pair = "Scegli una carta libera, poi scegline una seconda per eliminare la coppia."
back = "Riponi le carte prese, o esci dalla partita."
stock = "Pesca una carta dal mazzo."
deal = "Distribuisci una nuova riga dal mazzo."
run = "Prendi più o meno carte da una colonna."
quick_move = "Invia le carte sotto il cursore alla meta migliore."
waste_quick_move = "Invia la carta in cima agli scarti alla sua meta migliore da qualsiasi punto, senza spostare il cursore."
undo = "Annulla l'ultima mossa."
hint = "Evidenzia una mossa disponibile."
mouse = "Con il mouse: clicca su una carta, poi sulla meta; doppio clic invia alla meta migliore; clicca sul mazzo per pescare."

[klondike]
goal = "Sposta tutte le 52 carte sulle quattro fondazioni. Ogni fondazione cresce per seme, dall'asso al re."
layout_1 = "Sette colonne contengono da 1 a 7 carte. Solo la prima carta di ogni colonna è scoperta."
layout_2 = "Le altre 24 carte formano il mazzo. Le carte pescate vanno negli scarti."
layout_3 = "1 carta gira una carta alla volta. 3 carte ne gira tre, e solo la carta in cima agli scarti è giocabile."
moves_1 = "Costruisci le colonne in ordine decrescente a colori alternati, per esempio un 6 rosso su un 7 nero."
moves_2 = "Una sequenza di carte scoperte in ordine si muove insieme. Solo un re (o sequenza che inizia per re) va su colonna vuota."
moves_3 = "Un asso avvia una fondazione. Segue la carta successiva dello stesso seme."
moves_4 = "Una carta coperta viene girata non appena viene scoperta."
moves_5 = "Quando il mazzo è vuoto, gli scarti vengono rigirati nel mazzo. Si può ripetere all'infinito."
tips_1 = "Scopri prima le carte coperte. Nascondono le carte che ti servono."
tips_2 = "Porta presto assi e due sulle fondazioni, ma tieni le carte utili a costruire le colonne."
tips_3 = "Svuota una colonna solo se hai un re pronto da metterci."
tips_4 = "Bloccato? Premi {hint} per un suggerimento, o {undo} per annullare una mossa."

[spider]
goal = "Costruisci otto sequenze complete dello stesso seme, dal re all'asso. Ogni sequenza completata va su una fondazione."
layout_1 = "Dieci colonne contengono 5 o 6 carte ciascuna. Solo la prima carta di ogni colonna è scoperta."
layout_2 = "Le altre 50 carte formano il mazzo."
layout_3 = "Spider usa 104 carte con 1, 2 o 4 semi. Meno semi rendono il gioco più facile."
moves_1 = "Costruisci le colonne in ordine decrescente di valore per qualsiasi seme, per esempio un 6 di cuori su un 7 di picche."
moves_2 = "Solo una sequenza dello stesso seme in ordine decrescente si sposta in gruppo."
moves_3 = "Una colonna vuota accetta qualsiasi carta o sequenza."
moves_4 = "Una sequenza completa dal re all'asso viene rimossa dalla colonna in automatico."
moves_5 = "Il mazzo distribuisce una carta su ciascuna colonna. Non può essere usato se una colonna è vuota."
tips_1 = "Mantieni le sequenze dello stesso seme quando puoi. Una sequenza mista non può muoversi in blocco."
tips_2 = "Svuota presto una colonna. È lo strumento più utile in Spider."
tips_3 = "Riempi ogni colonna vuota prima di distribuire dal mazzo con {stock}."
tips_4 = "Cerca altre mosse prima di distribuire. Una distribuzione copre tutte le colonne."

[freecell]
goal = "Sposta tutte le 52 carte sulle quattro fondazioni. Ciascuna fondazione cresce per seme, dall'asso al re."
layout_1 = "Tutte le 52 carte sono distribuite scoperte in otto colonne, così puoi vederle tutte."
layout_2 = "Quattro celle libere accolgono una carta ciascuna. Non c'è mazzo."
moves_1 = "Costruisci le colonne in ordine decrescente a colori alternati."
moves_2 = "Metti una carta in una cella libera per liberare spazio, e riprendila quando può essere piazzata."
moves_3 = "Le fondazioni crescono per seme a partire dall'asso. Le carte non possono più uscirne."
moves_4 = "Per muovere più carte insieme servono celle libere o colonne vuote. Più ne hai, più lunga è la sequenza spostabile."
moves_5 = "Una colonna vuota accetta qualsiasi carta o sequenza."
tips_1 = "Pianifica in anticipo. Quasi tutte le distribuzioni possono essere vinte."
tips_2 = "Cerca di non riempire tutte e quattro le celle libere: sono il tuo spazio di manovra."
tips_3 = "Una colonna vuota vale più di una cella libera."
tips_4 = "Usa {undo} per annullare una mossa che non ha funzionato."

[pyramid]
goal = "Elimina le carte abbinando due carte la cui somma sia 13. Il re vale 13 da solo."
layout_1 = "28 carte formano una piramide di sette righe. Una carta è libera solo quando entrambe le carte che la coprono sono rimosse."
layout_2 = "Le altre 24 carte formano il mazzo. Le carte pescate vanno negli scarti."
layout_3 = "Valori: asso 1, fante 11, donna 12, re 13, ogni altra carta il proprio numero."
layout_4 = "Rilassata consente 3 passaggi del mazzo e si vince svuotando la piramide. Classica consente 1 passaggio e si vince togliendo tutte le 52 carte."
moves_1 = "Le carte libere sono quelle scoperte della piramide, la carta in cima al mazzo e quella in cima agli scarti."
moves_2 = "Scegli una carta libera, poi una seconda carta libera tale che la loro somma faccia 13. Entrambe vengono rimosse."
moves_3 = "Un re libero viene rimosso da solo: basta selezionarlo."
moves_4 = "Quando non ci sono più coppie, pesca dal mazzo."
tips_1 = "Elimina prima le righe inferiori, così da liberare più carte della piramide."
tips_2 = "Prima di rimuovere una carta, controlla che la sua compagna non serva per un'altra coppia."
tips_3 = "Premi {hint} per vedere una coppia o una pescata disponibile."

[yukon]
goal = "Sposta tutte le 52 carte sulle quattro fondazioni. Ogni fondazione cresce per seme, dall'asso al re."
layout_1 = "Sette colonne. La prima contiene una carta scoperta; le altre da 1 a 6 carte coperte sotto cinque carte scoperte."
layout_2 = "Vengono distribuite tutte le 52 carte. Non c'è mazzo né nuova distribuzione."
layout_3 = "Il solitario russo distribuisce allo stesso modo, ma costruisce le colonne in ordine decrescente nello stesso seme invece che a colori alternati: un 6 di cuori va solo su un 7 di cuori."
layout_4 = "Alaska distribuisce allo stesso modo, ma le colonne si costruiscono salendo o scendendo di un valore nello stesso seme: un 6 di cuori va solo su un 5 o un 7 di cuori."
layout_5 = "Moosehide distribuisce allo stesso modo, ma le colonne si costruiscono scendendo di un valore in qualsiasi seme tranne lo stesso: un 6 di fiori va su un 7 di picche, un 6 di picche no."
layout_6 = "Il solitario australiano distribuisce sette colonne di quattro carte scoperte; le altre 24 carte formano il mazzo. Il mazzo si gira una carta alla volta sugli scarti: un solo passaggio, senza ridistribuzione. La carta in cima agli scarti può andare su una colonna o su una fondazione. Le colonne si costruiscono scendendo in un solo seme, come nel solitario russo."
moves_1 = "Costruisci le colonne in ordine decrescente a colori alternati, per esempio un 6 rosso su un 7 nero."
moves_2 = "Ogni carta scoperta si sposta insieme a tutte le carte che ha sopra, anche se non sono in ordine. Deve combaciare solo la carta in fondo al gruppo spostato."
moves_3 = "Solo un re, o un gruppo con un re in fondo, può andare su una colonna vuota."
moves_4 = "Un asso avvia una fondazione. Segue la carta successiva dello stesso seme."
moves_5 = "Una carta coperta viene girata non appena viene scoperta."
tips_1 = "Scopri prima le carte coperte, partendo dalle colonne più lunghe."
tips_2 = "Un gruppo non deve essere in ordine, quindi puoi scavare a fondo in una colonna per raggiungere la carta che ti serve."
tips_3 = "I re sono difficili da spostare. Tieni una colonna vuota per un re che blocca carte coperte."
tips_4 = "Bloccato? Premi {hint} per un suggerimento, o {undo} per annullare una mossa."

[golf]
goal = "Elimina le 35 carte delle sette colonne giocandole sugli scarti."
layout_1 = "Sette colonne di cinque carte scoperte. La prima carta del mazzo viene girata sugli scarti per iniziarli; le altre 16 restano nel mazzo."
layout_2 = "Non ci sono fondazioni né nuova distribuzione: il mazzo si gira una carta alla volta, una sola volta."
moves_1 = "Gioca la carta in cima a una colonna sugli scarti quando il suo grado è di uno più alto o più basso della carta in cima agli scarti, di qualsiasi seme: un 7 va su un 6 o su un 8."
moves_2 = "Il re e l'asso non sono vicini, quindi non si torna da capo: sul re va solo una donna, sull'asso solo un 2."
moves_3 = "Ogni carta giocata diventa la nuova carta in cima agli scarti, così una serie può salire, scendere o cambiare direzione."
moves_4 = "Quando nessuna carta di colonna si adatta, gira la carta successiva del mazzo sugli scarti. A mazzo vuoto e senza carte giocabili, sei bloccato."
tips_1 = "Cerca la serie più lunga che puoi giocare prima di girare una carta del mazzo."
tips_2 = "Una serie che passa da una colonna all'altra mantiene la catena, quindi pianifica quale colonna svuotare per prima."
tips_3 = "Bloccato? Premi {hint} per un suggerimento o {undo} per annullare una mossa."

[tripeaks]
goal = "Elimina tutte le 28 carte dei tre picchi giocandole sugli scarti."
layout_1 = "28 carte formano tre picchi sovrapposti su file da 3, 6, 9 e 10. Solo la fila inferiore parte scoperta; una carta coperta si scopre quando entrambe le carte che la coprono sono state tolte."
layout_2 = "Una carta inizia gli scarti; le altre 23 formano il mazzo. Non ci sono fondazioni né nuova distribuzione."
moves_1 = "Gioca una carta scoperta e libera di un picco sugli scarti quando il suo grado è di uno più alto o più basso della carta in cima agli scarti, di qualsiasi seme: un 7 va su un 6 o su un 8."
moves_2 = "Re e asso si collegano a giro: un re va su un asso e un asso va su un re."
moves_3 = "Ogni carta giocata diventa la nuova carta in cima agli scarti, così una serie può salire, scendere o cambiare direzione."
moves_4 = "Quando nessuna carta dei picchi si adatta, gira la carta successiva del mazzo sugli scarti. A mazzo vuoto e senza carte giocabili, sei bloccato."
tips_1 = "Cerca serie lunghe che scoprano le carte coperte nei picchi."
tips_2 = "Usa i collegamenti tra re e asso per unire serie alte e basse prima di girare il mazzo."
tips_3 = "Bloccato? Premi {hint} per un suggerimento o {undo} per annullare una mossa."
