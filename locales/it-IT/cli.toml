# Strings of the cli area.

version = "oXySol {version}"
version_legal = "Copyright (c) {year} {authors}. Licenza {license}."
help = """
oXySol: Il solitario da ufficio definitivo per il terminale

Uso: oxysol [opzioni]

Opzioni:
  --version                    mostra versione e licenza, poi esci
  -h, --help                   mostra questo aiuto ed esci

Visualizzazione:
  --ascii                      carte solo con caratteri ASCII
  --colors <16|256|truecolor>  profondità di colore del terminale
  -fs, --fullscreen            avvia a schermo intero
  --no-fullscreen              avvia in finestra

Partita:
  --seed <u64>                 scegli una partita per questo seed

Prestazioni:
  --priority <livello>         priorità del processo, prevale sull'impostazione:
                               highest, high, normal, low, lowest

Finestra:
  -n, --new-window             apri il gioco in una nuova console
                               e torna subito al prompt

Doppio clic o console:
  Un doppio clic apre il gioco in una propria console, che si chiude
  all'uscita. Da console, gira dentro quella console, tranne se è dato
  --new-window. Dopo un errore all'avvio la finestra attende Enter.

Schermo intero:
  L'opzione Schermo intero (Auto, Sì, No) è nelle Impostazioni. Auto
  va a schermo intero solo in finestre aperte dal gioco stesso. Una
  console Windows classica è commutata dal gioco; altrove premi
  Alt+Enter o F11 (Ctrl+Cmd+F su macOS). Il gioco non si riavvia mai.

File:
  OXYSOL_HOME      cartella per database e log (ha la priorità)
  oxysol.portable  file marcatore: i file risiederanno in una
                   cartella data locale
  OXYSOL_LOG       livello di log: error, warn, info, debug o trace
"""
usage_error = "oxysol: {error}\nProva `oxysol --help` per l'elenco delle opzioni."
paths_failed = "oXySol non trova una cartella per i propri file. Imposta OXYSOL_HOME su una cartella con permessi di scrittura."
storage_failed = "oXySol non riesce ad aprire il database. I dettagli sono nel file di log."
terminal_failed = "oXySol si è arrestato per un errore del terminale. I dettagli sono nel file di log."
output_failed = "oXySol non riesce a scrivere sul terminale."
new_window_failed = "oXySol non riesce ad aprire una nuova finestra di console (tentativi: {tried}). Esegui senza --new-window."
log_unavailable = "oXySol non può scrivere il file di log {path}. Continua senza log."
panic = "oXySol si è interrotto in modo imprevisto in {location}. I dettagli sono in {path}."
press_enter = "Premi Enter per chiudere questa finestra."
