[variant]
klondike_one = "Klondike, Draw 1"
klondike_three = "Klondike, Draw 3"
spider_one = "Spider, 1 suit"
spider_two = "Spider, 2 suits"
spider_four = "Spider, 4 suits"
free_cell = "FreeCell"
pyramid_relaxed = "Pyramid, Relaxed"
pyramid_classic = "Pyramid, Classic"
yukon_classic = "Yukon"
yukon_russian = "Russian Solitaire"

[settings]
title = "Settings"

[size]
title = "Terminal too small"
current = "Current size: {width} x {height}"
required = "Required size: {width} x {height}"
hint = "Enlarge the window or zoom out: Ctrl+Minus (Cmd+Minus on a Mac)."

[dialog]
ok = "OK"
yes = "Yes"
no = "No"
help_title = "Help"
pause_title = "Paused"
pause_body = "Press Esc to continue."
win_title = "You won"
win_body = "The game is solved."
win_moves = "Moves: {moves}"
alert_title = "Notice"
