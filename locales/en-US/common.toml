capped_offer_none = "None of the seeds could be played as unknown. Keep searching?"
play_unproven = "Play as unknown"
more = "Keep searching"
cancel = "Cancel"

[error]
storage = "Saving to the database failed. The game continues without saving."
settings_load = "Stored settings could not be read. Defaults are used."
resume = "The saved game could not be restored."
