# Strings of the cli area.

version = "oXySol {version}"
help = """
oXySol: Ultimate Office Solitaire for the terminal

Usage: oxysol [options]

Options:
  --version                    print the version and exit
  --help                       print this help and exit

Display:
  --ascii                      draw cards with ASCII characters only
  --colors <16|256|truecolor>  color depth of the terminal

Game:
  --seed <u64>                 choose a game for this seed at once

Window:
  -n, --new-window             open the game in a new console window and
                               return to the prompt at once

Double-click or console:
  A double-click opens the game in its own console window, which closes
  when the game exits. Started from a console, the game runs inside that
  console, unless --new-window is given. After an error at startup the
  window waits for Enter.

Files:
  OXYSOL_HOME      folder for the database and the log (always wins)
  oxysol.portable  marker file next to the program: the files then live
                   in a data folder there
  OXYSOL_LOG       log level: error, warn, info, debug or trace
"""
usage_error = "oxysol: {error}\nTry `oxysol --help` for the list of options."
paths_failed = "oXySol cannot find a folder for its files. Set OXYSOL_HOME to a writable folder."
storage_failed = "oXySol cannot open its database. The details are in the log file."
terminal_failed = "oXySol stopped because the terminal failed. The details are in the log file."
output_failed = "oXySol cannot write to the terminal."
new_window_failed = "oXySol cannot open a new console window (tried: {tried}). Run it without --new-window."
log_unavailable = "oXySol cannot write its log file {path}. It continues without a log."
panic = "oXySol stopped unexpectedly at {location}. The details are in {path}."
press_enter = "Press Enter to close this window."
