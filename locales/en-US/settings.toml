[desc]
language = "The language of all text. Changes at once."
theme = "The colors of the interface."
card_back = "The colors and pattern of the backs of face-down cards."
card_face = "The color of face-up cards. Their suits keep the contrast. Theme uses the theme's own colors."
table_colour = "The colour of the table the cards lie on. Theme keeps the theme's own colour. A colour that fails the contrast tests is drawn in the nearest shade that passes."
table_feel = "The texture of the table: Plain has none, Felt a sparse dotted texture, Lined faint rules. The texture never sits under cards or text."
front_style = "The design of the card faces."
back_style = "The design of the backs of face-down cards."
glyphs = "Unicode draws suits and symbols; ASCII uses plain characters only; the oXySol font draws the card glyphs after a graphics check."
console_font = "Switch this console to the oXySol font, which draws the card glyphs. Classic Windows console only."
console_font_wt = "Windows Terminal: set the profile font face to \"oXySol Mono\"."
console_font_other = "This terminal keeps its own font. Use Symbols instead."
console_font_missing = "The oXySol font is not installed in this console (wiki page \"Card font\"). Unicode symbols stay."
console_font_refused = "The console did not accept the oXySol font. Unicode symbols stay."
font_face = "The font face of this console. A face this computer does not have is reported as not installed."
font_size = "The font size of this console, in pixels. Ctrl+Plus and Ctrl+Minus work here too."
font_face_card = "The oXySol font is in use and holds the face. Turn off Console font to choose another."
font_face_missing = "This face is not installed on this computer. The console keeps its font."
font_face_refused = "The console did not accept this face. It keeps its font."
font_terminal_wt = "Windows Terminal draws its own font and the game cannot change it. Zoom with the shortcut shown; the face is set in the profile."
font_terminal_other = "This terminal draws its own font and the game cannot change it. Zoom with the shortcut shown."
colors = "How many colors the terminal is asked to show. Auto detects it."
card_size = "Auto fits the window; a size that does not fit falls back. Keys ] [ 0 or Ctrl+wheel."
full_screen = "Auto: on only in the window the game opened itself. In a console: Alt+Enter or F11."
sound_style = "The sound of the cues and the music."
cues = "Short sounds for moves and for a win."
music = "Background music while a game is open."
volume = "The loudness of sound and music, in steps of 10%."
auto_finish = "Plays the last moves by itself once the win is certain."
aura = "Glow: Full marks the focus, carried cards and targets; Focus only, the focus."
aura_colour = "The color of the glow around the focus, a carried run and targets. Theme uses the theme's own colors."
aura_style = "Halo shades the cells around cards; Frame draws a line around them; Marks only draws no glow."
aura_size = "How many cells wide the glow is. Thick needs free space around the cards."
target_marks = "Marks the places a carried run can go with + and a glow."
guide_panel = "A side panel with hints for the focused card and the keys."
moves_panel = "A side panel listing every action with its key, active or not."
priority = "How much processor time the game asks for. Linux and macOS: raising it needs privileges."

