tips_2 = "Ciąg przechodzący między kolumnami podtrzymuje serię, więc zaplanuj, którą kolumnę opróżnić najpierw."
tips_3 = "Utknąłeś? Naciśnij {hint}, aby zobaczyć podpowiedź, lub {undo}, aby cofnąć ruch."

