moves_1 = "Kolumny buduj malejąco, naprzemiennie kolorami, na przykład czerwoną szóstkę na czarnej siódemce."
moves_2 = "Dowolna odkryta karta przenosi się razem ze wszystkimi kartami leżącymi na niej, nawet jeśli nie są uporządkowane. Pasować musi tylko dolna karta przenoszonej grupy."
moves_3 = "Na pustą kolumnę można położyć tylko króla albo grupę z królem na spodzie."
moves_4 = "As zaczyna stos końcowy. Po nim kładziesz kolejną kartę tego samego koloru."
moves_5 = "Zakryta karta odwraca się, gdy tylko zostanie odsłonięta."
