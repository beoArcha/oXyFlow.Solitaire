# Swiss deck: roses, bells, shields and acorns on the hearts, diamonds, spades and clubs of the game.
# The suits have no font glyphs: Font mode draws the Unicode symbols below. The symbols are WGL4 shapes
# that differ by shape (sun, note, triangle, disc); the roses and the acorns have no WGL4 picture.
# Court labels: Under, Ober, König; the card shows the single letters U, O and K, as the German style
# does (a label is at most two ASCII capitals). The court cards use the pictogram of the game.
# Colours: roses and bells are red, shields and acorns black, as in the German deck's red and black pairs.

name = "settings.style.swiss"

[ranks]
ace = "A"
jack = "U"
queen = "O"
king = "K"

[suits.clubs]
name = "cards.suit.acorn"
unicode = "●"
ascii = "e"
color = "card_black"

[suits.diamonds]
name = "cards.suit.bell"
unicode = "♪"
ascii = "s"
color = "card_red"

[suits.hearts]
name = "cards.suit.rose"
unicode = "☼"
ascii = "r"
color = "card_red"

[suits.spades]
name = "cards.suit.shield"
unicode = "▼"
ascii = "h"
color = "card_black"
