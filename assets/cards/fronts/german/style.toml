# German deck: acorns, leaves, hearts and bells on the clubs, spades, hearts and diamonds of the
# game; the Unicode and ASCII symbols are the closest WGL4 shapes and letters. Court labels: Unter,
# Ober, Koenig. The court emblems are the International ones.

name = "settings.style.german"

[ranks]
ace = "A"
jack = "U"
queen = "O"
king = "K"

[suits.clubs]
name = "cards.suit.acorn"
font = "fronts/german/acorn"
unicode = "♣"
ascii = "a"
color = "card_black"

[suits.diamonds]
name = "cards.suit.bell"
font = "fronts/german/bell"
unicode = "♦"
ascii = "b"
color = "card_red"

[suits.hearts]
name = "board.word.hearts"
font = "fronts/german/heart"
unicode = "♥"
ascii = "h"
color = "card_red"

[suits.spades]
name = "cards.suit.leaf"
font = "fronts/german/leaf"
unicode = "♠"
ascii = "l"
color = "card_black"

[courts]
jack = "fronts/international/jack"
queen = "fronts/international/queen"
king = "fronts/international/king"
